<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Từ Vựng Tiếng Anh Khối 10 (Unit 1 & Unit 2)</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      background: rgba(255, 255, 255, 0.98);
      padding: 25px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 720px;
      text-align: center;
    }
    h1 {
      font-size: 22px;
      color: #312e81;
      margin-top: 0;
      margin-bottom: 15px;
      border-bottom: 2px solid #e0e7ff;
      padding-bottom: 10px;
    }
    .filter-box {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    select {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #c7d2fe;
      background: #eef2ff;
      font-weight: bold;
      color: #3730a3;
      font-size: 14px;
      cursor: pointer;
    }
    .card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 15px;
      padding: 20px;
      margin: 15px 0;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .badge {
      background-color: #4f46e5;
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 12px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .word {
      font-size: 24px;
      font-weight: bold;
      color: #1e1b4b;
      margin: 5px 0;
    }
    .phonetic {
      font-size: 16px;
      color: #64748b;
      font-style: italic;
      margin-bottom: 10px;
    }
    .audio-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      margin-left: 6px;
      vertical-align: middle;
    }
    .audio-btn:hover { transform: scale(1.2); }
    
    /* Khu vực kiểm tra chính tả */
    .practice-box {
      width: 100%;
      margin-top: 10px;
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      text-align: left;
    }
    .practice-box label {
      font-size: 13px;
      font-weight: bold;
      color: #475569;
      display: block;
      margin-top: 8px;
    }
    .practice-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      font-size: 14px;
      margin-top: 3px;
    }
    .feedback {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      display: none;
      white-space: pre-line;
    }
    .feedback.correct { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .feedback.incorrect { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

    .answer-box {
      border-top: 2px dashed #cbd5e0;
      width: 100%;
      padding-top: 12px;
      margin-top: 12px;
      text-align: left;
    }
    .meaning {
      font-size: 18px;
      font-weight: bold;
      color: #15803d;
      margin-bottom: 6px;
    }
    .grammar {
      font-size: 14px;
      color: #334155;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
      line-height: 1.5;
      white-space: pre-line;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button.action-btn {
      flex: 1;
      min-width: 130px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-random { background: #4f46e5; color: white; }
    .btn-random:hover { background: #4338ca; }
    .btn-check { background: #d97706; color: white; }
    .btn-check:hover { background: #b45309; }
    .btn-answer { background: #16a34a; color: white; }
    .btn-answer:hover { background: #15803d; }
    .counter { font-size: 13px; color: #64748b; margin-bottom: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📚 Quiz Từ Vựng & Kiểm Tra Chính Tả tiếng Anh</h1>
    
    <div class="filter-box">
      <label for="sectionSelect"><b>Chọn phần ôn tập:</b></label>
      <select id="sectionSelect" onchange="filterSection()">
        <option value="all">Tất cả các phần</option>
        <option value="u1p1">Unit 1 - Phần 1 (Từ 1 - 15)</option>
        <option value="u1p2">Unit 1 - Phần 2 (Từ 16 - 29)</option>
        <option value="u1p3">Unit 1 - Phần 3 (Từ 30 - 47)</option>
        <option value="u1p4">Unit 1 - Phần 4 (Từ 48 - 55)</option>
        <option value="u1p5">Unit 1 - Phần 5 (Từ 56 - 68)</option>
        <option value="u1p6">Unit 1 - Phần 6 (Từ 69 - 78)</option>
        <option value="u1p7">Unit 1 - Phần 7 (Từ 79 - 87)</option>
        <option value="u2p1">Unit 2 - Phần 1 (Từ 1 - 14)</option>
      </select>
    </div>

    <div id="counter" class="counter">Số từ trong phần này: 0</div>

    <div class="card">
      <div id="question-area">
        <p id="prompt">Nhấn <b>"Từ Ngẫu Nhiên"</b> để bắt đầu!</p>
      </div>

      <div id="word-detail" style="display:none; width:100%;">
        <span id="type" class="badge">vp</span>
        <div class="word">
          <span id="word">word</span>
          <button class="audio-btn" onclick="speakWord()" title="Nghe phát âm">🔊</button>
        </div>
        <div id="phonetic" class="phonetic">/phonetic/</div>

        <!-- Ô thực hành gõ kiểm tra chính tả -->
        <div class="practice-box">
          <label for="userWord">✍️ Gõ lại từ Tiếng Anh (Kiểm tra chính tả):</label>
          <input type="text" id="userWord" placeholder="Nhập từ Tiếng Anh..." autocomplete="off">
          
          <label for="userType">🏷️ Loại từ (vd: n, v, a, adv, vp, np):</label>
          <input type="text" id="userType" placeholder="Nhập loại từ..." autocomplete="off">

          <label for="userGrammar">📝 Cụm đi kèm / Ngữ pháp (tùy chọn):</label>
          <input type="text" id="userGrammar" placeholder="Nhập cụm từ hoặc cấu trúc..." autocomplete="off">

          <div id="feedback" class="feedback"></div>
        </div>
      </div>

      <div id="answer-box" class="answer-box" style="display:none;">
        <div id="meaning" class="meaning">Nghĩa: ...</div>
        <div id="grammar" class="grammar">Ghi chú / Cấu trúc: ...</div>
      </div>
    </div>

    <div class="btn-group">
      <button class="action-btn btn-random" onclick="randomWord()">Từ Ngẫu Nhiên</button>
      <button class="action-btn btn-check" onclick="checkSpelling()">Kiểm Tra Lỗi</button>
      <button class="action-btn btn-answer" onclick="showAnswer()">Xem Đáp Án</button>
    </div>
  </div>

  <script>
    const vocab = [

      { part: "u1p1", word: "clean the house", type: "vp", phonetic: "/kliːn ðə haʊs/", meaning: "dọn dẹp nhà cửa", grammar: "clean the kitchen: dọn dẹp nhà bếp" },
      { part: "u1p1", word: "divide sth into", type: "vp", phonetic: "/dɪˈvaɪd/", meaning: "chia cái gì thành...", grammar: "separate into parts or group: tách ra thành các phần hoặc nhóm" },
      { part: "u1p1", word: "do the cooking", type: "vp", phonetic: "/duː ðə ˈkʊkɪŋ/", meaning: "nấu ăn", grammar: "• do the chores = do housework: làm việc nhà\n• do the heavy lifting: làm việc nặng\n• do the laundry: giặt giũ\n• do the shopping = go grocery shopping: đi chợ\n• do the washing-up = wash/do the dishes: rửa bát" },

      { part: "u1p1", word: "earn money", type: "vp", phonetic: "/ɜːn ˈmʌni/", meaning: "kiếm tiền", grammar: "earn a living / a salary: kiếm sống / nhận lương" },
      { part: "u1p1", word: "help sb with sth", type: "v", phonetic: "/help/", meaning: "giúp ai việc gì", grammar: "give / lend sb a helping hand: ra tay giúp đỡ ai" },
      { part: "u1p1", word: "homemaker", type: "n", phonetic: "/ˈhəʊmmeɪkər/", meaning: "người nội trợ", grammar: "Danh từ chỉ người làm nội trợ" },
      { part: "u1p1", word: "household chores", type: "n", phonetic: "/ˈhaʊshəʊld tʃɔːz/", meaning: "việc nhà", grammar: "• do household chores: làm việc nhà\n• split / share household chores: phân chia việc nhà" },
      { part: "u1p1", word: "make the bed", type: "v", phonetic: "/meɪk ðə bed/", meaning: "dọn dẹp / gấp chăn gối giường", grammar: "Cụm động từ cố định" },
      { part: "u1p1", word: "sports field", type: "n", phonetic: "/spɔːts fiːld/", meaning: "sân thể thao", grammar: "= stadium (n): sân vận động" },
      { part: "u1p1", word: "prepare for sth", type: "v", phonetic: "/prɪˈpeər/", meaning: "chuẩn bị cho cái gì", grammar: "• prepare dinner: chuẩn bị bữa tối\n• prepare the meals: chuẩn bị các bữa ăn" },
      { part: "u1p1", word: "put out the rubbish", type: "v", phonetic: "/pʊt aʊt ðə ˈrʌbɪʃ/", meaning: "đi đổ rác", grammar: "• garbage = trash (n): rác thải\n• take out the garbage: mang rác đi đổ\n• dispose of garbage/waste: xử lý rác" },
      { part: "u1p1", word: "shop for grocery", type: "v", phonetic: "/ʃɒp fɔː ˈɡrəʊsəri/", meaning: "đi mua hàng tạp hóa", grammar: "Cụm động từ" },
      { part: "u1p1", word: "study for exams", type: "v", phonetic: "/ˈstʌdi fɔː ɪɡˈzæmz/", meaning: "học ôn thi", grammar: "sit for / take an exam: tham gia dự kỳ thi" },

      // UNIT 1 - PHẦN 2 (16 - 29)

      { part: "u1p3", word: "bond", type: "n", phonetic: "/bɒnd/", meaning: "mối quan hệ, tình cảm", grammar: "strengthen / build / form / foster a bond: củng cố/hình thành mối quan hệ" },
      { part: "u1p3", word: "character", type: "n", phonetic: "/ˈkærəktər/", meaning: "tính cách, nhân vật", grammar: "build / develop character: phát triển tính cách" },
      { part: "u1p3", word: "develop", type: "v", phonetic: "/dɪˈveləp/", meaning: "phát triển, mở rộng", grammar: "development (n): sự phát triển" },
      { part: "u1p3", word: "good for", type: "a", phonetic: "/ɡʊd fɔːr/", meaning: "tốt cho", grammar: "Tính từ đi với giới từ for" },
      { part: "u1p3", word: "grateful", type: "a", phonetic: "/ˈɡreɪtfʊl/", meaning: "biết ơn", grammar: "• gratitude (n): lòng biết ơn\n• be grateful to sb for sth: biết ơn ai về việc gì\n• express / show gratitude to sb: thể hiện lòng biết ơn" },

    ];

    let filteredVocab = [...vocab];
    let current = null;

    function filterSection() {
      const selectedPart = document.getElementById("sectionSelect").value;
      if (selectedPart === "all") {
        filteredVocab = [...vocab];
      } else {
        filteredVocab = vocab.filter(item => item.part === selectedPart);
      }
      document.getElementById("counter").innerText = `Số từ trong phần này: ${filteredVocab.length}`;
      randomWord();
    }

    function randomWord() {
      if (filteredVocab.length === 0) return;
      current = filteredVocab[Math.floor(Math.random() * filteredVocab.length)];
      
      document.getElementById("prompt").style.display = "none";
      document.getElementById("word-detail").style.display = "block";
      document.getElementById("answer-box").style.display = "none";

      document.getElementById("type").innerText = current.type;
      document.getElementById("word").innerText = current.word;
      document.getElementById("phonetic").innerText = current.phonetic || "";

      // Reset các ô gõ và feedback
      document.getElementById("userWord").value = "";
      document.getElementById("userType").value = "";
      document.getElementById("userGrammar").value = "";
      const fb = document.getElementById("feedback");
      fb.style.display = "none";
      fb.className = "feedback";
    }

    function showAnswer() {
      if (current) {
        document.getElementById("meaning").innerText = `Nghĩa: ${current.meaning}`;
        document.getElementById("grammar").innerText = `Ghi chú / Cấu trúc:\n${current.grammar}`;
        document.getElementById("answer-box").style.display = "block";
      }
    }

    function checkSpelling() {
      if (!current) return;

      const userWord = document.getElementById("userWord").value.trim().toLowerCase();
      const userType = document.getElementById("userType").value.trim().toLowerCase();
      const userGrammar = document.getElementById("userGrammar").value.trim().toLowerCase();

      const correctWord = current.word.trim().toLowerCase();
      const correctType = current.type.trim().toLowerCase();
      const correctGrammar = current.grammar.trim().toLowerCase();

      let messages = [];
      let isWordCorrect = false;

      // Kiểm tra chính tả từ
      if (userWord === "") {
        messages.push("⚠️ Bạn chưa nhập từ Tiếng Anh!");
      } else if (userWord === correctWord) {
        messages.push("✅ Chính tả Từ Tiếng Anh: CHÍNH XÁC!");
        isWordCorrect = true;
      } else {
        messages.push(`❌ Lỗi chính tả từ: Bạn nhập '${userWord}' | Đáp án đúng: '${current.word}'`);
      }

      // Kiểm tra loại từ (nếu có nhập)
      if (userType !== "") {
        if (userType === correctType) {
          messages.push("✅ Loại từ: CHÍNH XÁC!");
        } else {
          messages.push(`❌ Loại từ sai: Bạn nhập '${userType}' | Đáp án đúng: '${current.type}'`);
        }
      }

      // Kiểm tra cụm / ngữ pháp (nếu có nhập)
      if (userGrammar !== "") {
        if (correctGrammar.includes(userGrammar)) {
          messages.push("✅ Cụm từ/Ngữ pháp: CHÍNH XÁC (Trùng khớp một phần hoặc hoàn toàn)!");
        } else {
          messages.push(`❌ Ngữ pháp/Cụm từ chưa chính xác với gợi ý trong đề cương.`);
        }
      }

      const fb = document.getElementById("feedback");
      fb.style.display = "block";
      fb.innerText = messages.join("\n");
      
      if (isWordCorrect && (userType === "" || userType === correctType)) {
        fb.className = "feedback correct";
      } else {
        fb.className = "feedback incorrect";
      }

      // Tự động mở đáp án chi tiết khi kiểm tra
      showAnswer();
    }

    function speakWord() {
      if (current && 'speechSynthesis' in window) {
        const cleanWord = current.word.split('/')[0].split('#')[0].replace(/sb|sth|V|to/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(cleanWord);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    // Khởi tạo ban đầu
    filterSection();
  </script>
