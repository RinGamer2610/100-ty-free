<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện từ vựng – tự điền & kiểm tra chính tả</title>
<meta name="description" content="Ôn từ vựng Unit 1–5 bằng cách tự điền và kiểm tra chính tả. Dữ liệu được đọc từ file JSON.">
<style>
:root {
  --bg:#f5f6fa; --card:#fff; --line:#d8dce5; --text:#172033;
  --muted:#687386; --accent:#4f46e5; --accent-soft:#eef0ff;
  --good:#15803d; --bad:#b91c1c; --warn:#b45309;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
.wrap { max-width:1150px; margin:0 auto; padding:22px; }
h1 { margin:0 0 6px; font-size:28px; }
.sub { margin:0 0 18px; color:var(--muted); }
.toolbar { display:grid; grid-template-columns:1fr 1fr 1.8fr; gap:10px; margin-bottom:16px; }
select,input,button { font:inherit; }
select,input[type="text"],input[type="number"] {
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
  background:#fff; outline:none;
}
input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.1); }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 7px 24px rgba(0,0,0,.04); }
.meta { color:var(--muted); font-size:14px; margin-bottom:8px; }
.meaning { text-align:center; font-size:27px; font-weight:800; margin:4px 0 5px; }
.main-type { text-align:center; font-size:18px; margin-bottom:20px; }
.main-type strong { color:var(--accent); }
.instruction { margin:0 0 14px; color:var(--muted); line-height:1.5; }
table { width:100%; border-collapse:collapse; table-layout:fixed; }
th,td { border:1px solid var(--line); padding:8px; vertical-align:middle; }
th { background:#f0f2f7; text-align:left; font-weight:800; }
th:nth-child(1) { width:14%; }
th:nth-child(2) { width:15%; }
th:nth-child(3) { width:36%; }
th:nth-child(4) { width:35%; }
td input { padding:9px 10px; }
.actions { display:flex; gap:9px; flex-wrap:wrap; margin-top:16px; }
button { border:0; border-radius:10px; padding:10px 14px; cursor:pointer; font-weight:700; }
.primary { background:var(--accent); color:#fff; }
.secondary { background:#e9ebf2; color:#283247; }
.score { margin-top:14px; padding:10px 12px; background:var(--accent-soft); border-radius:10px; display:none; }
.score.show { display:block; }
.ok { border:2px solid var(--good) !important; background:#f0fdf4 !important; }
.no { border:2px solid var(--bad) !important; background:#fff5f5 !important; }
.feedback { margin-top:12px; font-size:14px; }
.feedback .good { color:var(--good); }
.feedback .bad { color:var(--bad); }
.progress { color:var(--muted); font-size:14px; margin-top:12px; }
.legend { font-size:13px; color:var(--muted); margin-top:8px; }
@media(max-width:760px) {
  .toolbar { grid-template-columns:1fr; }
  .meaning { font-size:23px; }
  table { font-size:13px; }
  th,td { padding:6px; }
  th:nth-child(1) { width:15%; } th:nth-child(2) { width:16%; }
  th:nth-child(3) { width:34%; } th:nth-child(4) { width:35%; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ôn từ vựng – tự điền để kiểm tra chính tả</h1>
  <p class="sub">Chỉ cho sẵn nghĩa của nhóm từ và loại từ của <b>từ chính</b>. Bạn tự điền bảng bên dưới rồi bấm <b>Chấm bài</b>.</p>

  <div class="toolbar">
    <select id="unit"><option value="ALL">Tất cả Unit</option></select>
    <select id="part"><option value="ALL">Tất cả phần</option></select>
    <input id="search" type="text" placeholder="Tìm theo nghĩa hoặc số từ...">
  </div>

  <div class="card" id="card"></div>
</div>

<script>
let GROUPS = [];
const state = { unit:"ALL", part:"ALL", search:"", index:0, filtered:[] };

const unitEl=document.getElementById("unit");
const partEl=document.getElementById("part");
const searchEl=document.getElementById("search");
const card=document.getElementById("card");

function uniq(a) { return [...new Set(a.filter(Boolean))]; }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch])
  );
}

function fillUnits() {
  for (const u of uniq(GROUPS.map(x=>x.unit))) {
    const o=document.createElement("option"); o.value=u; o.textContent=u; unitEl.appendChild(o);
  }
}

function fillParts() {
  const ps=uniq(GROUPS.filter(x=>state.unit==="ALL"||x.unit===state.unit).map(x=>x.part));
  partEl.innerHTML='<option value="ALL">Tất cả phần</option>';
  for (const p of ps) {
    const o=document.createElement("option"); o.value=p; o.textContent=p; partEl.appendChild(o);
  }
  if (!ps.includes(state.part)) { state.part="ALL"; partEl.value="ALL"; }
}

function filtered() {
  const q=state.search.trim().toLowerCase();
  return GROUPS.filter(x=>{
    if(state.unit!=="ALL" && x.unit!==state.unit) return false;
    if(state.part!=="ALL" && x.part!==state.part) return false;
    if(!q) return true;
    return [x.unit,x.part,String(x.so??""),x.meaning,x.main_word].join(" ").toLowerCase().includes(q);
  });
}

function check() {
  const x=state.filtered[state.index];
  let correct=0, total=0;
  x.words.forEach((ans,i)=>{
    const row=document.querySelectorAll("#vocabBody tr")[i];
    const inputs=row.querySelectorAll("input");
    const vals=[...inputs].map(z=>z.value.trim());
    const expected=[ans.nhan_am||"",ans.loai_tu||"",ans.tu||"",ans.nghia||""];
    inputs.forEach((inp,j)=>{
      inp.classList.remove("ok","no");
      const typed=vals[j];
      const exp=expected[j].trim();
      if (typed && typed.toLowerCase()===exp.toLowerCase()) {
        inp.classList.add("ok"); correct++;
      } else {
        inp.classList.add("no");
      }
      total++;
    });
  });
  const box=document.getElementById("score");
  box.innerHTML = `<b>Kết quả:</b> ${correct}/${total} ô đúng. 
    <span class="legend">Ô xanh = đúng, ô đỏ = sai hoặc chưa điền.</span>`;
  box.classList.add("show");
}

function next(delta) {
  state.index += delta;
  if(state.index<0) state.index=state.filtered.length-1;
  if(state.index>=state.filtered.length) state.index=0;
  render();
}

function randomGroup() {
  if(state.filtered.length<=1) return;
  let n=Math.floor(Math.random()*state.filtered.length);
  if(n===state.index) n=(n+1)%state.filtered.length;
  state.index=n; render();
}

function render() {
  state.filtered=filtered();
  if(!state.filtered.length) {
    card.innerHTML='<div style="text-align:center;padding:30px;color:#687386">Không có nhóm từ phù hợp.</div>';
    return;
  }
  if(state.index>=state.filtered.length) state.index=0;

  const x=state.filtered[state.index];
  const no=x.so!=null ? `Từ số ${x.so}` : "Nhóm từ";
  const rows=x.words.map((ans,i)=>`
    <tr>
      <td><input type="text" data-col="stress" placeholder="Điền nhấn âm"></td>
      <td><input type="text" data-col="pos" placeholder="Loại từ"></td>
      <td><input type="text" data-col="word" placeholder="Tự điền từ"></td>
      <td><input type="text" data-col="meaning" placeholder="Nghĩa tiếng Việt"></td>
    </tr>`).join("");

  card.innerHTML=`
    <div class="meta">${esc(x.unit)} • ${esc(x.part)} • ${no}</div>
    <div class="meaning">${esc(x.meaning)}</div>
    <div class="main-type">Loại từ của từ chính: <strong>${esc(x.main_pos)}</strong></div>
    <p class="instruction">Hãy tự nhớ và điền tất cả các từ liên quan vào bảng. Không hiện sẵn đáp án để bạn có thể luyện chính tả.</p>

    <table>
      <thead>
        <tr>
          <th>Nhấn âm</th>
          <th>Loại từ</th>
          <th>Từ</th>
          <th>Nghĩa tiếng Việt của từ liên quan</th>
        </tr>
      </thead>
      <tbody id="vocabBody">${rows}</tbody>
    </table>

    <div id="score" class="score"></div>

    <div class="actions">
      <button class="primary" onclick="check()">Chấm bài</button>
      <button class="secondary" onclick="next(-1)">← Từ trước</button>
      <button class="secondary" onclick="next(1)">Từ tiếp →</button>
      <button class="secondary" onclick="randomGroup()">Ngẫu nhiên</button>
    </div>
    <div class="progress">Nhóm ${state.index+1} / ${state.filtered.length}</div>
  `;
}

unitEl.onchange=()=>{ state.unit=unitEl.value; state.index=0; fillParts(); render(); };
partEl.onchange=()=>{ state.part=partEl.value; state.index=0; render(); };
searchEl.oninput=()=>{ state.search=searchEl.value; state.index=0; render(); };

async function loadVocabulary() {
  try {
    const response = await fetch("./tu_vung_unit_1_5_word.json");
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    GROUPS = [];
    for (const unit of (data.units || [])) {
      for (const part of (unit.parts || [])) {
        for (const group of (part.groups || [])) {
          const main = group.tu_chinh;
          const related = group.tu_lien_quan || [];
          if (!main) continue;
          GROUPS.push({
            unit: unit.unit || "",
            part: part.part || "",
            so: group.so ?? null,
            meaning: main.nghia || "",
            main_pos: main.loai_tu || "",
            main_word: main.tu || "",
            words: [main, ...related]
          });
        }
      }
    }
    fillUnits();
    fillParts();
    render();
  } catch (err) {
    card.innerHTML = '<div style="text-align:center;padding:30px;color:#b91c1c">Không tải được dữ liệu từ vựng. Hãy kiểm tra file <b>tu_vung_unit_1_5_word.json</b> có nằm cùng thư mục với index.html không.</div>';
    console.error(err);
  }
}

loadVocabulary();
</script>
</body>
</html>
